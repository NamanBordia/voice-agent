[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "voiceagent-pipecat"
version = "0.1.0"
description = "Local-development voice agent scaffold using FastAPI and Pipecat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "pipecat-ai[deepgram,cerebras,cartesia,silero,webrtc]==1.2.1",
    "deepgram-sdk>=6.1.1,<7",
    "loguru>=0.7.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: marks tests that require live API credentials and internet access",
]
